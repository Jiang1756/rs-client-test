name: Flutter Nightly Build

on:
  workflow_dispatch:

env:
  # RustDesk 服务器配置（通过 Secrets 注入）
  RENDEZVOUS_SERVER: ${{ secrets.RUSTDESK_ID_SERVER }}
  RS_RELAY: ${{ secrets.RUSTDESK_RELAY_SERVER }}
  API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
  RS_PUB_KEY: ${{ secrets.RUSTDESK_PUB_KEY }}

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
